name: Waywise
options:
  bundleIdPrefix: com.waywise
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
targets:
  WaywiseDemo:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaywiseDemo
    info:
      path: WaywiseDemo/Info.plist
      properties:
        CFBundleDisplayName: Waywise Demo
        UILaunchScreen:
          UIColorName: ""
        NSLocationAlwaysAndWhenInUseUsageDescription: Waywise uses location during a demo drive to attach GPS context to road-impact events.
        NSLocationWhenInUseUsageDescription: Waywise uses location during a demo drive to attach GPS context to road-impact events.
        NSMotionUsageDescription: Waywise uses motion data to capture road-impact spikes during a demo drive.
        UIBackgroundModes:
          - location
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waywise.demo
        INFOPLIST_FILE: WaywiseDemo/Info.plist
  WaywiseDemoTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WaywiseDemoTests
    dependencies:
      - target: WaywiseDemo
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.waywise.demo.tests

