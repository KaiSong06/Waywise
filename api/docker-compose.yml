services:
  postgres:
    image: postgis/postgis:16-3.5
    platform: linux/amd64
    environment:
      POSTGRES_DB: waywise
      POSTGRES_USER: waywise
      POSTGRES_PASSWORD: waywise
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waywise -d waywise"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - waywise-postgres-data:/var/lib/postgresql/data

volumes:
  waywise-postgres-data:
